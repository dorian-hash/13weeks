document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

a05630-fc18-4879-bdc1-edaf407444df\"><\u002Fscript>\n<script src=\"49162077-ae1c-4706-bdae-e9aeab039501\"><\u002Fscript>\n<script src=\"b04322a5-8449-4f29-be30-045d66a27060\"><\u002Fscript>\n<style>\n  :root {\n    --bg: #0d0f13;\n    --panel: #15181e;\n    --panel2: #1b1f27;\n    --line: #262b35;\n    --ink: #edeff2;\n    --dim: #8d95a3;\n    --gold: #ffc233;\n    --red: #e8323c;\n    --red-lt: #ff8a8f;\n    --blue-lt: #9db4ff;\n    --dim2: #a9afb9;\n    --teal: #2fc39f;\n    --blue: #5d8cff;\n    --violet: #a97bff;\n    --lime: #9ccf3a;\n    --orange: #ff8a3d;\n    --on-bright: #17130a;\n    --well: #090b0e;\n    --track: #22262e;\n    --scrim: rgba(0,0,0,0.26);\n    --scrim-2: rgba(0,0,0,0.34);\n    --scrim-3: rgba(0,0,0,0.4);\n    --hair: rgba(255,255,255,0.028);\n    --gold-hi: #ffd776;\n    --gold-05: rgba(255,194,51,0.05);\n    --gold-07: rgba(255,194,51,0.07);\n    --gold-09: rgba(255,194,51,0.09);\n    --gold-10: rgba(255,194,51,0.1);\n    --gold-14: rgba(255,194,51,0.14);\n    --gold-18: rgba(255,194,51,0.18);\n    --gold-26: rgba(255,194,51,0.26);\n    --gold-35: rgba(255,194,51,0.35);\n    --red-18: rgba(232,50,60,0.18);\n    --red-30: rgba(232,50,60,0.3);\n    --blue-09: rgba(93,140,255,0.09);\n    --teal-deep: #06201a;\n    --slate: #3a4250;\n    --ink-2: #c3c9d2;\n    --ink-3: #b6bdc7;\n    --ink-4: #7d879a;\n    --ink-5: #d4d9e0;\n    --ink-6: #dfe3e9;\n    --ink-7: #eae9e9;\n    --dim-3: #9aa2ae;\n    --surf-1: #191c23;\n    --surf-2: #20242c;\n    --surf-3: #101318;\n    --surf-4: #12151b;\n    --line-2: #333a46;\n    --red-deep: #c8102e;\n    --red-deep-2: #b8121c;\n    --violet-deep: #150c22;\n    --teal-18: rgba(47,195,159,0.18);\n    --gold-03: rgba(255,194,51,0.03);\n    --gold-08: rgba(255,194,51,0.08);\n    --gold-12: rgba(255,194,51,0.12);\n    --gold-30: rgba(255,194,51,0.3);\n    --red-03: rgba(232,50,60,0.03);\n    --red-10: rgba(232,50,60,0.1);\n    --red-14: rgba(232,50,60,0.14);\n    --red-16: rgba(232,50,60,0.16);\n    --red-22: rgba(232,50,60,0.22);\n    --red-50: rgba(232,50,60,0.5);\n    --edge: rgba(255,255,255,0.09);\n  }\n  body { margin: 0; background: var(--bg); }\n  a { color: var(--gold); text-decoration: none; border-bottom: 1px solid var(--gold-35); }\n  a:hover { color: var(--gold-hi); border-bottom-color: var(--gold-hi); }\n  .daycell { transition: background 120ms linear; }\n  .daycell:hover { background: var(--gold-09); }\n  .wknav { transition: background 120ms linear, padding-left 120ms linear; }\n  .wknav:hover { background: var(--gold-10); padding-left: 20px; }\n  .btnq { transition: background 120ms linear, border-color 120ms linear; }\n  .btnq:hover { background: var(--gold-12); border-color: var(--gold); }\n  .ico { width: 16px; height: 16px; stroke-width: 2.1; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }\n  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.28; } }\n  textarea, input { font-family: inherit; }\n  ::selection { background: var(--gold-30); }\n  /* Layout breakpoint: below this the fixed 296px rail starves the content column,\n     so the rail unpins and stacks above the page. Cannot be expressed inline. */\n  @media (max-width: 860px) {\n    .shell { grid-template-columns: minmax(0, 1fr) !important; }\n    .rail { position: static !important; max-height: none !important; }\n    .railwrap { border-right: 0 !important; border-bottom: 1px solid var(--line); }\n  }\n  /* A day cell needs ~120px of content width for its longest single word. Reflow off the\n     grid's own width so tracks can never be narrower than that — viewport breakpoints were\n     holding 7 columns ~460px past the point where they still fit, forcing mid-word breaks. */\n  .week7 { grid-template-columns: repeat(auto-fit, minmax(max(122px, calc((100% - 6px) / 7)), 1fr)) !important; }\n  /* break-word splits words even when the softer rule wouldn't; overflow-wrap alone is enough */\n  .daycell, .daycell * { word-break: normal !important; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"shell\" style=\"min-height: 100vh; background: var(--bg); color: var(--ink); font-family: 'Archivo', sans-serif; display: grid; grid-template-columns: 296px minmax(0, 1fr);\">\n\n  \n\n  <!-- ══ PINNED RAIL ══ -->\n  <div class=\"railwrap\" style=\"border-right: 1px solid var(--line); background: var(--panel);\">\n    <div class=\"rail\" style=\"position: sticky; top: 0; max-height: 100vh; overflow-y: auto;\">\n\n      <div style=\"padding: 16px 20px 13px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 9px;\">\n        <span style=\"width: 7px; height: 7px; border-radius: 50%; background: var(--fill-red); animation: pulse 2.2s ease-in-out infinite; flex: none;\"><\u002Fspan>\n        <span style=\"flex: 1; min-width: 0;\">\n          <span style=\"display: block; font-size: 13.5px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ setup.name }}<\u002Fspan>\n          <span style=\"display: block; font-size: 11px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ setup.unit }}<\u002Fspan>\n        <\u002Fspan>\n        <button title=\"Change the name, unit and platoon\" style=\"flex: none; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--bg); color: var(--dim2); font-family: inherit; font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; padding: 6px 9px; border-radius: 999px; cursor: pointer;\" sc-camel-on-click=\"{{ goSetup }}\">\n          <svg sc-camel-view-box=\"0 0 24 24\" style=\"width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;\"><path d=\"M12 20h9\"><\u002Fpath><path d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z\"><\u002Fpath><\u002Fsvg>\n          Edit\n        <\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"padding: 13px 20px 15px; border-bottom: 1px solid var(--line);\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 10px;\">\n          <span style=\"font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim);\">Write to him at<\u002Fspan>\n          <button title=\"Set his platoon number and unit\" style=\"flex: none; border: 0; background: transparent; color: var(--gold); font-family: inherit; font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; padding: 0; cursor: pointer;\" sc-camel-on-click=\"{{ goSetup }}\">Edit<\u002Fbutton>\n        <\u002Fdiv>\n        \n        <pre style=\"font-family: 'Archivo', sans-serif; font-size: 12.5px; line-height: 1.65; margin: 8px 0 0; white-space: pre-wrap; color: var(--ink-7)\">{{ mailBlock }}<\u002Fpre>\n        <a href=\"https://sandboxx.us\" target=\"_blank\" style=\"display: block; text-align: center; border: 0; background: var(--fill-gold); color: var(--on-fill-gold); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; padding: 9px 14px; border-radius: 999px; margin-top: 11px;\">Write on Sandboxx<\u002Fa>\n      <\u002Fdiv>\n\n      <div style=\"position: relative; aspect-ratio: 4 / 5; background: var(--well); border-bottom: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 0 14px 14px;\">\n        <image-slot id=\"tracker-rail-photo\" shape=\"rect\" fit=\"cover\" placeholder=\"Drop his photo here\" src=\"8bd2089f-fdfb-45d5-b5c2-b7cb9b87cce1\"><\u002Fimage-slot>\n      <\u002Fdiv>\n\n      <div style=\"padding: 18px 20px 16px; border-bottom: 1px solid var(--line);\">\n        <div style=\"font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim);\">Counting down to {{ cd.targetLabel }}<\u002Fdiv>\n\n        <div style=\"position: relative; width: {{ cd.sizePx }}; height: {{ cd.sizePx }}; margin: 12px auto 0; max-width: 100%;\">\n alue=\"{{ c.isEmblem }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size: 17px; font-weight: 800; line-height: 1.12; letter-spacing: -0.01em; color: var(--on-fill-gold); margin-top: 7px;\">Emblem Ceremony<\u002Fdiv>\n                <div style=\"font-size: 11px; line-height: 1.4; font-weight: 600; color: var(--on-fill-gold); margin-top: 4px;\">He becomes a Marine.<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ c.showChips }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display: grid; gap: 5px; margin-top: 8px;\"><sc-for list=\"{{ c.chips }}\" as=\"ch\" hint-placeholder-count=\"2\"><span style=\"display: block; background: {{ ch.bg }}; border: 1px solid {{ ch.border }}; color: {{ ch.ink }}; font-size: 11.5px; line-height: 1.35; font-weight: {{ ch.weight }}; padding: 5px 8px; border-radius: 7px; overflow-wrap: break-word; word-break: break-word;\">{{ ch.text }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ c.hasNick }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: {{ c.nickColor }}; margin-top: 7px; overflow-wrap: break-word; word-break: break-word;\">“{{ c.nick }}”<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ c.hasLetter }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border: 1px dashed {{ c.letterBorder }}; color: {{ c.letterColor }}; background: {{ c.letterBg }}; font-size: 8.5px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.3; font-weight: 700; padding: 4px 7px; margin-top: 8px; border-radius: 7px; overflow-wrap: break-word; word-break: break-word;\">✉ {{ c.letterLabel }}<\u002Fdiv>\n              <\u002Fsc-if>\n\n              <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"border-top: 1px solid var(--line);\">\ 16px;\">\n        <svg class=\"ico\" sc-camel-view-box=\"0 0 24 24\" style=\"color: var(--gold); flex: none;\"><rect x=\"2\" y=\"5\" width=\"20\" height=\"14\"><\u002Frect><circle cx=\"9\" cy=\"12\" r=\"2.5\"><\u002Fcircle><path d=\"M14 10h5\"><\u002Fpath><path d=\"M14 14h3\"><\u002Fpath><\u002Fsvg>\n        <span style=\"flex: 1; min-width: 240px;\">\n          <span style=\"display: block; font-size: 15.5px; font-weight: 700;\">Every visitor 18 and over needs a REAL ID<\u002Fspan>\n          <span style=\"display: block; font-size: 13px; line-height: 1.55; color: var(--ink-2); margin-top: 5px;\">{{ v.realId }}<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(255px, 100%), 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 16px;\">\n        <sc-for list=\"{{ v.gradDays }}\" as=\"g\" hint-placeholder-count=\"3\">\n          <div style=\"background: var(--panel); padding: 18px 20px;\">\n            <div style=\"font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--red-lt);\">{{ g.day }}<\u002Fdiv>\n            <div style=\"font-size: 17px; font-weight: 700; margin-top: 8px;\">{{ g.title }}<\u002Fdiv>\n            <div style=\"font-size: 13px; line-height: 1.55; margin-top: 8px; color: var(--ink-2);\">{{ g.body }}<\u002Fdiv>\n            <div style=\"font-size: 12px; line-height: 1.5; color: var(--dim); margin-top: 10px; border-top: 1px solid var(--line); padding-top: 9px;\">{{ g.note }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 16px;\">\n        <div style=\"background: var(--panel); padding: 17px 20px;\">\n          <div style=\"font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim);\">Graduation day · Fri Nov 13<\u002Fdiv>\n          <div style=\"margin-top: 10px;\">\n            <sc-for list=\"{{ gradSchedule }}\" as=\"s\" hint-placeholder-count=\"5\">\n              <div style=\"display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); align-items: baseline;\">\n                <span style=\"font-size: 12.5px; font-weight: 700; color: {{ s.color }};\">{{ s.time }}<\u002Fspan>\n                <span>\n                  <span style=\"display: block; font-size: 13px;\">{{ s.what }}<\u002Fspan>\n                  <span style=\"display: block; font-size: 11.5px; color: var(--dim); margin-top: 2px;\">{{ s.where }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: var(--panel); padding: 17px 20px;\">\n          <div style=\"font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim);\">Getting on base<\u002Fdiv>\n          <div style=\"margin-top: 10px;\">\n            <sc-for list=\"{{ v.baseAccess }}\" as=\"b\" hint-placeholder-count=\"4\">\n              <div style=\"display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); align-items: baseline;\">\n                <span style=\"font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim);\">{{ b.k }}<\u002Fspan>\n                <span style=\"font-size: 13px; line-height: 1.45;\">{{ b.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; align-items: baseline; gap: 13px; margin-top: 26px; flex-wrap: wrap;\">\n        <span style=\"font-size: 17px; font-weight: 700;\">Trip checklist<\u002Fspan>\n        <span style=\"font-size: 12.5px; color: var(--teal);\">{{ checkedCount }} of {{ checkTotal }} done<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(285px, 100%), 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 12px;\">\n        <sc-for list=\"{{ checklist }}\" as=\"c\" hint-placeholder-count=\"10\">\n          <button style=\"background: var(--panel); display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px 16px; border: 0; cursor: pointer; text-align: left; font: inherit; color: inherit;\" sc-camel-on-click=\"{{ c.toggle }}\">\n            <span style=\"width: 20px; height: 20px; border-radius: 6px; border: 2px solid {{ c.boxBorder }}; background: {{ c.boxBg }}; color: var(--teal-deep); display: grid; place-items: center; font-size: 12px; font-weight: 700; margin-top: 1px;\">{{ c.mark }}<\u002Fspan>\n            <span>\n              <span style=\"display: block; font-size: 14px; font-weight: 600; color: {{ c.fg }}; text-decoration: {{ c.strike }};\">{{ c.label }}<\u002Fspan>\n              <span style=\"display: block; font-size: 12px; line-height: 1.5; color: var(--dim); margin-top: 3px;\">{{ c.note }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 9 · MY NOTES -->\n    <div id=\"sec-notes\" style=\"margin: 34px 26px 60px; border-top: 1px solid var(--line); padding-top: 24px;\">\n      <div style=\"display: flex; align-items: center; gap: 11px; flex-wrap: wrap;\">\n        <svg class=\"ico\" sc-camel-view-box=\"0 0 24 24\" style=\"color: var(--violet);\"><path d=\"M12 20h9\"><\u002Fpath><path d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-size: 23px; font-weight: 700; letter-spacing: -0.02em;\">My notes<\u002Fspan>\n        <span style=\"flex: 1;\"><\u002Fspan>\n        <span style=\"font-size: 11.5px; color: var(--dim);\">Saved in this browser only<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 16px;\">\n        <div style=\"background: var(--panel); padding: 17px 20px;\">\n          <div style=\"font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--violet);\">Letters and calls log<\u002Fdiv>\n          <textarea placeholder=\"Aug 21 — first letter sent via Sandboxx\nSep 3 — his letter arrived, sounded tired but okay\" value=\"{{ logNote }}\" sc-camel-on-change=\"{{ setLog }}\" sc-camel-on-input=\"{{ setLog }}\" style=\"width: 100%; box-sizing: border-box; margin-top: 10px; min-height: 120px; resize: vertical; background: var(--bg); border: 1px solid var(--line); color: var(--ink); font-size: 13.5px; line-height: 1.6; padding: 12px 14px; border-radius: 9px;\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div style=\"background: var(--panel); padding: 17px 20px;\">\n          <div style=\"font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--violet);\">Anything else to remember<\u002Fdiv>\n          <textarea placeholder=\"Questions for the next call, things to send, who's coming to graduation\" value=\"{{ freeNote }}\" sc-camel-on-change=\"{{ setFree }}\" sc-camel-on-input=\"{{ setFree }}\" style=\"width: 100%; box-sizing: border-box; margin-top: 10px; min-height: 120px; resize: vertical; background: var(--bg); border: 1px solid var(--line); color: var(--ink); font-size: 13.5px; line-height: 1.6; padding: 12px 14px; border-radius: 9px;\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 20px;\">\n        <sc-for list=\"{{ v.overrides }}\" as=\"o\" hint-placeholder-count=\"2\">\n          <div style=\"background: var(--red-10); border-left: 3px solid var(--fill-red); padding: 17px 20px;\">\n            <div style=\"font-size: 15.5px; font-weight: 700;\">{{ o.title }}<\u002Fdiv>\n            <div style=\"font-size: 13px; line-height: 1.6; color: var(--ink-2); margin-top: 8px;\">{{ o.body }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div id=\"sec-setup\" style=\"margin-top: 22px; border-top: 2px solid var(--fill-gold); padding-top: 18px;\">\n        <div style=\"font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold);\">Your recruit — name, unit, platoon<\u002Fdiv>\n        <div style=\"font-size: 13px; line-height: 1.55; color: var(--dim2); margin-top: 6px; max-width: 70ch;\">Type here and the sidebar, the mailing address and the whole page update as you go. Saved in this browser only.<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); gap: 14px; margin-top: 12px; max-width: 1000px;\">\n          <sc-for list=\"{{ fields }}\" as=\"f\" hint-placeholder-count=\"4\">\n            <label style=\"display: block;\">\n              <span style=\"display: block; font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--dim);\">{{ f.label }}<\u002Fspan>\n              <input type=\"{{ f.type }}\" value=\"{{ f.value }}\" placeholder=\"{{ f.hint }}\" sc-camel-on-change=\"{{ f.set }}\" sc-camel-on-input=\"{{ f.set }}\" style=\"width: 100%; box-sizing: border-box; margin-top: 7px; background: var(--bg); border: 1px solid var(--line); color: var(--ink); font-size: 14.5px; padding: 12px 14px; border-radius: 9px;\">\n            <\u002Flabel>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size: 12px; color: var(--dim); margin-top: 12px;\">Every date on this page is calculated from the ship date.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 1520, &quot;height&quot;: 1000 },\n  &quot;countdownTarget&quot;: {\n    &quot;editor&quot;: &quot;enum&quot;,\n    &quot;options&quot;: [&quot;Graduation&quot;, &quot;Family Day&quot;, &quot;Emblem Ceremony&quot;, &quot;Next phone call&quot;],\n    &quot;default&quot;: &quot;Graduation&quot;,\n    &quot;tsType&quot;: &quot;string&quot;,\n    &quot;section&quot;: &quot;Countdown&quot;\n  },\n  &quot;showSeconds&quot;: {\n    &quot;editor&quot;: &quot;boolean&quot;,\n    &quot;default&quot;: true,\n    &quot;tsType&quot;: &quot;boolean&quot;,\n    &quot;section&quot;: &quot;Countdown&quot;\n  },\n  &quot;dialMeaning&quot;: {\n    &quot;editor&quot;: &quot;enum&quot;,\n    &quot;options&quot;: [&quot;Whole training&quot;, &quot;This week&quot;, &quot;Today&quot;],\n    &quot;default&quot;: &quot;Whole training&quot;,\n    &quot;tsType&quot;: &quot;string&quot;,\n    &quot;section&quot;: &quot;Countdown&quot;\n  },\n  &quot;dialStyle&quot;: {\n    &quot;editor&quot;: &quot;enum&quot;,\n    &quot;options&quot;: [&quot;Donut&quot;, &quot;Pie&quot;, &quot;Segments&quot;],\n    &quot;default&quot;: &quot;Donut&quot;,\n    &quot;tsType&quot;: &quot;string&quot;,\n    &quot;section&quot;: &quot;Countdown&quot;\n  },\n  &quot;dialSize&quot;: {\n    &quot;editor&quot;: &quot;range&quot;,\n    &quot;min&quot;: 120,\n    &quot;max&quot;: 250,\n    &quot;step&quot;: 10,\n    &quot;default&quot;: 176,\n    &quot;unit&quot;: &quot;px&quot;,\n    &quot;tsType&quot;: &quot;number&quot;,\n    &quot;section&quot;: &quot;Countdown&quot;\n  },\n  &quot;dialColor&quot;: {\n    &quot;editor&quot;: &quot;color&quot;,\n    &quot;options&quot;: [&quot;var(--gold)&quot;, &quot;var(--red)&quot;, &quot;var(--teal)&quot;, &quot;var(--blue)&quot;, &quot;var(--violet)&quot;],\n    &quot;default&quot;: &quot;var(--gold)&quot;,\n    &quot;tsType&quot;: &quot;string&quot;,\n    &quot;section&quot;: &quot;Countdown&quot;\n  }\n}\">\nconst KEY = \"bc_tracker_v1\";\nconst SECS = [\n  [\"sec-now\", \"Right now\", \"var(--red)\", \"M12 8v4l3 2 M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z\"],\n  [\"sec-weeks\", \"The 13 weeks\", \"var(--gold)\", \"M8 2v4 M16 2v4 M3 10h18 M5 6h14v15H5Z\"],\n  [\"sec-photos\", \"Platoon photos\", \"var(--violet)\", \"M14.5 4h-5L7 7H4v13h16V7h-3l-2.5-3Z M12 10a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z\"],\n  [\"sec-grad\", \"Graduation week\", \"var(--teal)\", \"M22 10 12 5 2 10l10 5 10-5Z M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5\"],\n  [\"sec-notes\", \"My notes & setup\", \"var(--blue)\", \"M12 20h9 M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z\"]\n];\nclass Component extends DCLogic {\n  state = { checks: {}, notes: {}, setup: {}, log: \"\", free: \"\" };\n  componentDidMount() {\n    let saved = null;\n    try { const raw = localStorage.getItem(KEY); if (raw) { saved = JSON.parse(raw); this.setState(saved); } } catch (e) {}\n    if (window.BC_SET_THEME) window.BC_SET_THEME((saved && saved.theme) || \"corps\");\n    this.startTimer();\n  }\n  componentDidUpdate(prevProps) {\n    if (prevProps.showSeconds !== this.props.showSeconds) this.startTimer();\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n  startTimer() {\n    clearInterval(this.timer);\n    const fast = (this.props.showSeconds ?? true) !== false;\n    // must be setState — forceUpdate() does not repaint in this runtime\n    this.timer = setInterval(() => this.setState({ tick: Date.now() }), fast ? 1000 : 30000);\n  }\n  countdown(v) {\n    const P = this.props;\n    const target = P.countdownTarget || \"Graduation\";\n    const size = P.dialSize || 176;\n    const color = P.dialColor || \"var(--gold)\";\n    const style = P.dialStyle || \"Donut\";\n    const meaning = P.dialMeaning || \"Whole training\";\n    const seconds = (P.showSeconds ?? true) !== false;\n\n    const at = (iso, h, m) => { const d = new Date(iso + \"T00:00:00\"); d.setHours(h, m || 0, 0, 0); return d; };\n    const TARGETS = {\n      \"Graduation\": { when: at(v.B.gradDate, 10, 0), label: \"graduation\" },\n      \"Family Day\": { when: at(\"2026-11-12\", 8, 0), label: \"Family Day\" },\n      \"Emblem Ceremony\": { when: at(v.B.emblemDate, 6, 0), label: \"the Emblem Ceremony\" },\n      \"Next phone call\": { when: this.nextCallDate(v), label: \"his next call\" }\n    };\n    const T = TARGETS[target] || TARGETS.Graduation;\n    const now = new Date();\n    const ms = Math.max(0, T.when.getTime() - now.getTime());\n    const d = Math.floor(ms / 86400000);\n    const h = Math.floor(ms / 3600000) % 24;\n    const m = Math.floor(ms / 60000) % 60;\n    const sec = Math.floor(ms / 1000) % 60;\n\n    // what the dial fills against\n    let pct;\n    if (meaning === \"This week\") {\n      const wStart = new Date(v.B.weeks[v.curIndex].start + \"T00:00:00\").getTime();\n      pct = Math.min(100, Math.max(0, Math.round(((now.getTime() - wStart) / (7 * 86400000)) * 100)));\n    } else if (meaning === \"Today\") {\n      const mid = new Date(now); mid.setHours(0, 0, 0, 0);\n      pct = Math.round(((now.getTime() - mid.getTime()) / 86400000) * 100);\n    } else {\n      pct = v.progress.pct;\n    }\n\n    const C = 2 * Math.PI * 42;\n    const step = C / 13;\n    const segments = v.B.weeks.map((w, i) => ({\n      color: i < v.curIndex ? color : (i === v.curIndex ? \"var(--red)\" : \"var(--track)\"),\n      dash: (step - 3).toFixed(2) + \" \" + (C - step + 3).toFixed(2),\n      offset: (-i * step).toFixed(2)\n    }));\n\n    const isSegments = style === \"Segments\";\n    const isPie = style === \"Pie\";\n    const r = isPie ? 21 : 42;\n    const sw = isPie ? 42 : 9;\n    const arcC = 2 * Math.PI * r;\n    const filled = (arcC * pct) / 100;\n\n    const units = [\n      { label: \"days\", value: d, color: color },\n      { label: \"hrs\", value: h, color: \"var(--ink)\" },\n      { label: \"min\", value: m, color: \"var(--ink)\" }\n    ];\n    if (seconds) units.push({ label: \"sec\", value: sec, color: \"var(--teal)\" });\n\n    return {\n      targetLabel: T.label,\n      targetDate: T.when.toLocaleDateString(undefined, { weekday: \"short\", month: \"short\", day: \"numeric\" }),\n      d: d, sizePx: size + \"px\", color: color,\n      isSegments: isSegments, isArc: !isSegments,\n      r: r, sw: sw, cap: isPie ? \"butt\" : \"round\",\n      dash: filled.toFixed(2) + \" \" + arcC.toFixed(2),\n      segments: segments,\n      dialPct: pct,\n      dialWord: meaning === \"Whole training\" ? \"of training done\" : (meaning === \"This week\" ? \"through the week\" : \"of today gone\"),\n      units: units, unitCols: units.length\n    };\n  }\n  nextCallDate(v) {\n    const m = (v.nextCall.when || \"\").match(/([A-Z][a-z]{2})\\s+(\\d+)/);\n    if (!m) return new Date(v.B.gradDate + \"T10:00:00\");\n    const mo = [\"Jan\",\"Feb\",\"Mar\",\"Apr\",\"May\",\"Jun\",\"Jul\",\"Aug\",\"Sep\",\"Oct\",\"Nov\",\"Dec\"].indexOf(m[1]);\n    return new Date(2026, mo, +m[2], 9, 0, 0, 0);\n  }\n  save(patch) {\n    this.setState(patch, () => {\n      const s = this.state;\n      try { localStorage.setItem(KEY, JSON.stringify({ checks: s.checks, notes: s.notes, setup: s.setup, log: s.log, free: s.free, theme: s.theme })); } catch (e) {}\n    });\n  }\n  jump(id) {\n    const el = document.getElementById(id);\n    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 14, behavior: \"smooth\" });\n  }\n  renderVals() {\n    // Re-date the whole dataset from the family's own ship date before anything reads it.\n    if (window.BC_APPLY_SHIP) window.BC_APPLY_SHIP((this.state.setup || {}).ship || \"\");\n    const v = window.BC_VIEW && window.BC_VIEW(new Date());\n    const X = window.BC_EXTRAS;\n    const G = v && window.BC_GRID && window.BC_GRID(v);\n    if (!v || !X || !G) return {};\n    // Before he ships there is no training day to report — rewrite the \"now\" facts\n    // rather than letting the hero and rail claim he is living a day on the matrix.\n    if (v.preShip) {\n      const n = v.preShip.days;\n      v.hour.title = n === 1 ? \"He ships tomorrow\" : \"He ships in \" + n + \" days\";\n      v.hour.what = \"Nothing on the matrix has started yet. He leaves on \" + v.preShip.dateLabel + \" and arrives at MCRD late that night.\";\n      v.hour.explain = \"\";\n      v.hour.expected = \"Time at home, and packing light — he takes nothing but paperwork and the clothes he travels in.\";\n      v.hour.felt = \"\\u201cThe waiting was the worst part. Once you're on the bus it's out of your hands.\\u201d\";\n      v.hour.block = \"\";\n      v.hour.video = \"\";\n      v.hour.pct = 0;\n      v.week = Object.assign({}, v.week, { label: \"Not yet shipped\", name: \"Ships \" + v.preShip.dateLabel });\n      v.day = v.day.map(b => Object.assign({}, b, { state: \"ahead\", pct: 0 }));\n    }\n    const FA = window.BC_FAITH_FOR ? window.BC_FAITH_FOR(v.week.key, new Date()) : null;\n    const s = this.state.setup || {};\n    const checks = this.state.checks || {};\n    const notes = this.state.notes || {};\n    const PH = { receiving: \"var(--ink-4)\", p1: \"var(--gold)\", p2: \"var(--orange)\", p3: \"var(--red)\", p4: \"var(--teal)\" };\n    // p2 used --orange, which the two-theme collapse resolves to #cc0033 — the fill-role red.\n    // Text roles only here: --gold-hi keeps Phase 2 reading warm between gold and scarlet.\n    const PHT = { receiving: \"var(--dim2)\", p1: \"var(--gold)\", p2: \"var(--gold-hi)\", p3: \"var(--red-lt)\", p4: \"var(--teal)\" };\n    // B3b + C1: a solid bar per week card, in a phase colour that brightens as he gets closer,\n    // so all thirteen weeks are no longer visually identical.\n    const PBAR = { receiving: \"var(--phase-recv)\", p1: \"var(--phase-p1)\", p2
